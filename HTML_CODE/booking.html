<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Rental</title>
<link rel="stylesheet" href="{{ url_for('static', filename='booking.css') }}">
</head>
<body>

    <header class="header">
    <div class="nav container">
        
        <a href="#" class="logo">Revora</a>

        <nav class="navbar">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('home') }}#trending">Trending</a>
            <a href="{{ url_for('home') }}#rentals">Cars</a>
            <a href="{{ url_for('home') }}#reviews">Reviews</a>
        </nav>

        <div class="nav-icons">
            <a href="#"><i class='bx bx-search'></i></a>
            <a href="{{ url_for('login_page') }}">
                <i class='bx bx-user'></i>
            </a>
        </div>

    </div>
</header>

<div class="wrapper">


    <div class="form-box login" id="step1">
        <h2>Select Your Car</h2>

        <div class="input-box">
            <select id="car">
              <option value="">Loading cars...</option>
            </select>
        </div>

        <p id="priceDisplay"></p>
        <button class="btn" id="toStep2">Continue</button>
    </div>

    <div class="form-box login" id="step2" style="display:none">
        <h2>Select Dates</h2>

        <h3 id="carName"></h3>
        <h4 id="carPrice"></h4>

        <div class="input-box">
            <input type="date" id="start">
            <label>Start Date</label>
        </div>

        <div class="input-box">
            <input type="date" id="end">
            <label>End Date</label>
        </div>

        <button class="btn" id="toStep3">Continue</button>
    </div>

    
    
    <div class="form-box register" id="step3" style="display:none">
        <h2>Payment</h2>

        <h3 id="summary"></h3>

        <div class="input-box">
            <input type="text" required>
            <label>Card Number</label>
        </div>

        <div class="input-box">
            <input type="text" required>
            <label>Card Holder</label>
        </div>

        <div class="input-box">
            <input type="text" required>
            <label>Expiry</label>
        </div>

        <div class="input-box">
            <input type="text" required>
            <label>CVV</label>
        </div>

        <button class="btn" id="payBtn">Pay Now</button>
        
    </div>
</div>

<script src="{{ url_for('static', filename='booking.js') }}"></script>
</body>
</html>
