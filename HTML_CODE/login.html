<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝔏𝔬𝔤𝔦𝔫/ℜ𝔢𝔤𝔦𝔰𝔱𝔯𝔞𝔱𝔦𝔬𝔫 𝔭𝔞𝔤𝔢</title>

    <!--CSS file for login page-->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">

    <!--JavaScript File-->
<script src="{{ url_for('static', filename='login.js') }}" defer></script>
</head>

<body>


    <!--======================== Header / Navigation ===========================-->
    <header class="header">
    <div class="nav">
        <h2 class="logo">Revora</h2>
        <!--Navbar-->
        <nav class="navbar">
            <a href="{{ url_for('home') }}">𝗛𝗼𝗺𝗲</a>
            <a href="{{ url_for('home') }}#trending">𝗧𝗿𝗲𝗻𝗱𝗶𝗻𝗴</a>
            <a href="{{ url_for('home') }}#rentals">𝗖𝗮𝗿𝘀</a>
            <a href="{{ url_for('home') }}#reviews">𝗥𝗲𝘃𝗶𝗲𝘄𝘀</a>
        </nav>
    </div>
</header>
        <!--======================= Login / Register Container =======================-->
        <!--Non Standart feature: Popup form controlled with Javascript-->
    
        <div class="wrapper">

            
<!--===========LOGIN FORM=================-->
        <div class="form-box login">
            <h2>Login</h2>

            <!--Sends login data to flask-->
            <form action="/login_user" method="POST">
                <!--Email Input-->
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail"></ion-icon></span>
                    <input type="email" name="email" required>
                    <label>Email</label>
                </div>
            <!--Password Input-->
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                    <input type="password" name="password" required>
                    <label>Password</label>
                </div>

                <!--Remember me/ Forgot password-->
                <div class="remember-forgot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>
                <!--Submit button-->
                <button type="submit" class="btn">Login</button>
                <!--Switches to register form-->
                <div class="login-register">
                    <p>Don't have an account? <a href="#" class="register-link">Register</a></p>
                </div> </form>
        </div>

        <!--===================== Registration Form =================-->
        <div class="form-box register">
            <h2>Registration</h2>
            <!--Sends Registration data to Flask-->
            <form action="/register" method="POST">

                <!--Email Input-->
                <div class="input-box">
                    <span class="icon"><ion-icon name="person"></ion-icon></span>
                    <input type="text" name="email" required>
                    <label>Email</label>
                </div>
                <!--Username Input-->
                <div class="input-box">
                    <span class="icon"><ion-icon name="person"></ion-icon></span>
                    <input type="text" name="username" required>
                    <label>Username</label>
                </div>

                <!--Password Input-->
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                    <input type="password" name="password" required>
                    <label>Password</label>
                </div>
                <!--Terms Checkbox-->
                <div class="remember-forgot">
                    <label><input type="checkbox"> I agree to the terms and Conditions  </label>
                </div>
                <!--Submit Registration-->
                <button type="submit" class="btn">Register</button>

                <!--Switches back to login-->
                <div class="login-register">
                    <p>Already have an account? <a href="#" class="login-link">Login</a></p>
                </div> </form>
        </div>
    <!--Link to Java file-->
    </div> <script src="login.js" defer></script>

    <!--Ionicons libary pack used for form icons-->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
