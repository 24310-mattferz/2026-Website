<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revora | Automotive</title>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../CSS_AND_JS/home.css">
</head>
<body>

<header>
    <div class="nav container">
        
        <a href="#" class="logo">Revora</a>

        <nav class="navbar">
            <a href="#" class="nav-link">Home</a>
            <a href="#" class="nav-link">Trending</a>
            <a href="#" class="nav-link">Cars</a>
            <a href="#" class="nav-link">Team</a>
            <a href="#" class="nav-link">Reviews</a>
        </nav>

        <div class="nav-icons">
            <a href="#"><i class='bx bx-search'></i></a>
            <a href="#"><i class='bx bx-user'></i></a>

            <div class="menu-icon">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </div>

    </div>
</header>

<section class="home" id="home">
    <div class="home-content container">

        <div class="home-img">
            <img src="../IMAGES/home.png" alt="">
        </div>

        <form class="input-form">
            <div class="input-box">
                <span>Location</span>
                <input type="search" placeholder="Search Places">
            </div>

            <div class="input-box">
                <span>Start</span>
                <input type="date">
            </div>

            <div class="input-box">
                <span>Return</span>
                <input type="date">
            </div>

            <i class="bx bx-search search-btn"></i>
        </form>
    </div>

</section> 

<section class="trending container" id="trending">
    <div class="heading">
        <h2>Trending Vehicles</h2>
    </div>

    <div class="trending-content">

        <div class="trend-box">
            <h4>Electric</h4>
            <img src="../IMAGES/trending1.png" alt="">
            <h3>TURBO V8</h3>
            <p>From $299/day</p>
        </div>

        <div class="trend-box">
            <h4>Electric</h4>
            <img src="../IMAGES/trending2.png" alt="">
            <h3>V12 NA</h3>
            <p>From $299/day</p>
        </div>

        <div class="trend-box">
            <h4>Electric</h4>
            <img src="../IMAGES/trending3.png" alt="">
            <h3>FLAT 6</h3>
            <p>From $299/day</p>
        </div>

        <div class="trend-box">
            <h4>Electric</h4>
            <img src="../IMAGES/trending4.png" alt="">
            <h3>TWIN TURBO V8</h3>
            <p>From $299/day</p>
       
        </div>
    </div>
</section>

<script src="../CSS_AND_JS/home.js"></script>

</body>
</html>
